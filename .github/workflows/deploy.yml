name: Deploy portal to Azure
# Manual: configurar primero las variables y la identidad federada del README.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: portal-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate settings
        env:
          APP: ${{ vars.AZURE_WEBAPP_NAME }}
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUB: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$APP" && test -n "$CLIENT" && test -n "$TENANT" && test -n "$SUB"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          pip install -r requirements.txt pytest
          pytest -q
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Package source
        run: zip -r app.zip app.py requirements.txt startup.txt templates static
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app.zip
